<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#071424">
  <meta name="description" content="Orbital Cleanup Co. — a cozy 2D space cleanup game.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <style>
    :root { color-scheme: dark; --bg:#071424; --cyan:#51e7ff; --mint:#9af8d7; --yellow:#ffd166; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); }
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; touch-action:none; }
    #canvas { display:block; width:100%; height:100%; outline:0; }
    #occ-loader {
      position:fixed; inset:0; display:grid; place-items:center; z-index:10;
      background:radial-gradient(circle at 72% 38%, #123852 0, #071424 42%, #040b13 100%);
      transition:opacity .25s ease, visibility .25s ease;
    }
    #occ-loader.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .occ-loader-card { width:min(520px, calc(100vw - 48px)); padding:28px; border:1px solid #2d6c83; border-radius:20px; background:#0a1c2bde; box-shadow:0 24px 80px #0008; }
    .occ-eyebrow { color:var(--mint); letter-spacing:.14em; font-size:12px; font-weight:800; }
    .occ-title { margin:8px 0 4px; color:#f5fbff; font-size:clamp(28px,5vw,46px); }
    .occ-subtitle { margin:0 0 20px; color:#a8c0cd; }
    .occ-track { height:8px; overflow:hidden; border-radius:999px; background:#102b3d; }
    #occ-progress { height:100%; width:3%; border-radius:inherit; background:linear-gradient(90deg,var(--cyan),var(--mint)); transition:width .12s linear; }
    .occ-debug-ad { position:fixed; inset:14%; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; border:2px dashed var(--yellow); border-radius:24px; background:#071424f2; color:white; text-align:center; font:600 18px/1.4 system-ui,sans-serif; }
    .occ-debug-ad small { color:#9fb6c2; font-weight:400; }
    @media (max-width: 600px) { .occ-loader-card { padding:22px; } }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">Your browser does not support the canvas element.</canvas>
  <div id="occ-loader" aria-live="polite">
    <div class="occ-loader-card">
      <div class="occ-eyebrow">ORBITAL CLEANUP CO. // BOOTING</div>
      <h1 class="occ-title">Orbital Cleanup Co.</h1>
      <p class="occ-subtitle">Keeping the galaxy tidy, one orbit at a time.</p>
      <div class="occ-track"><div id="occ-progress"></div></div>
    </div>
  </div>
  <noscript>Orbital Cleanup Co. requires JavaScript and WebAssembly.</noscript>
  <script src="platform/platform-config.js"></script>
  <script src="platform/debug-provider.js"></script>
  <script src="platform/platform-loader.js"></script>
  <script src="$GODOT_URL"></script>
  <script>
    (() => {
      const loader = document.getElementById('occ-loader');
      const progress = document.getElementById('occ-progress');
      const engine = new Engine($GODOT_CONFIG);

      async function boot() {
        await window.OCCPlatformReady;
        await engine.startGame({
          onProgress(current, total) {
            const ratio = total > 0 ? Math.min(1, current / total) : 0.03;
            progress.style.width = Math.max(3, ratio * 100) + '%';
          },
        });
        loader.classList.add('hidden');
      }

      boot().catch(error => {
        console.error('[OCC] WEB_BOOT_FAILED', error);
        document.querySelector('.occ-subtitle').textContent = 'Unable to start the Web build. Check the browser console for details.';
      });
    })();
  </script>
</body>
</html>
