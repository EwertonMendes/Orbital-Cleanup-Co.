name: Orbital Cleanup Co. Web

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: occ-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve tested revision
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHA="${PR_HEAD_SHA:-$DISPATCH_SHA}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Fast static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_bootstrap.py &
          P1=$!
          python3 tools/validate_content.py &
          P2=$!
          node .github/scripts/platform-provider-smoke.mjs &
          P3=$!
          wait "$P1"
          wait "$P2"
          wait "$P3"

      - name: Restore Godot toolchain
        id: godot-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/occ-godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: occ-godot-web-v1-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot toolchain on cold cache
        if: steps.godot-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/.cache/occ-godot"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.cache/occ-godot/godot"
          chmod +x "$HOME/.cache/occ-godot/godot"

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz" -o /tmp/templates.tpz
          rm -rf /tmp/occ-templates
          mkdir -p /tmp/occ-templates
          unzip -q /tmp/templates.tpz 'templates/web*.zip' 'templates/version.txt' -d /tmp/occ-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/occ-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Activate Godot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$HOME/.cache/occ-godot/godot"
          sudo ln -sf "$HOME/.cache/occ-godot/godot" /usr/local/bin/godot

      - name: Restore imported resources
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: occ-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.gd', '**/*.tscn', '**/*.tres', 'content/**/*.json', 'schemas/**/*.json', 'assets/**/*', 'i18n/**/*') }}
          restore-keys: |
            occ-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Validate contracts and export Web
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          OCC_PROVIDER: debug
          OCC_ENVIRONMENT: preview
          OCC_COMMIT: ${{ steps.source.outputs.sha }}
          OCC_WORKFLOW_RUN: ${{ github.run_id }}
          OCC_GAMEMONETIZE_GAME_ID: ""
        run: |
          set -euo pipefail

          # Playwright installs while Godot validates/exports instead of adding
          # another serial CI stage.
          npm install --no-save --ignore-scripts "playwright@${PLAYWRIGHT_VERSION}" >/tmp/occ-npm.log 2>&1 &
          NPM_PID=$!

          # Godot's global class registry is generated during import. The core
          # contract suite references class_name types, so a clean CI checkout
          # must populate that registry before parsing the suite.
          godot --headless --path . --import 2>&1 | tee /tmp/occ-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERR_FILE_CORRUPT|Error loading image:|Error importing ' /tmp/occ-import.log; then
            exit 1
          fi

          godot --headless --path . --script tools/validate_core_contracts.gd 2>&1 | tee /tmp/occ-contracts.log
          grep -q '\[QA\] CORE_CONTRACTS_OK' /tmp/occ-contracts.log

          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/occ-export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERR_FILE_CORRUPT|Error loading image:|Error importing ' /tmp/occ-export.log; then
            exit 1
          fi

          mkdir -p build/web/platform
          cp web/platform/*.js build/web/platform/
          cp assets/branding/orbital_cleanup_icon.svg build/web/favicon.svg
          VERSION="$(tr -d '\r\n' < VERSION)"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sed -i \
            -e "s|__OCC_PROVIDER__|${OCC_PROVIDER}|g" \
            -e "s|__OCC_VERSION__|${VERSION}|g" \
            -e "s|__OCC_COMMIT__|${OCC_COMMIT}|g" \
            -e "s|__OCC_ENVIRONMENT__|${OCC_ENVIRONMENT}|g" \
            -e "s|__OCC_WORKFLOW_RUN__|${OCC_WORKFLOW_RUN}|g" \
            -e "s|__OCC_BUILT_AT__|${BUILT_AT}|g" \
            -e "s|__OCC_GAMEMONETIZE_GAME_ID__|${OCC_GAMEMONETIZE_GAME_ID}|g" \
            build/web/platform/platform-config.js

          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          test -s build/web/index.pck
          wait "$NPM_PID"

      - name: Smoke Web and compose preview
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test -x "$CHROME_BIN"

          python3 -m http.server 8000 --directory build/web >/tmp/occ-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          node .github/scripts/browser-smoke.mjs &
          SMOKE_PID=$!

          bash .github/scripts/compose-pages-site.sh site build/web pull_request "${PR_NUMBER:-manual}" "$HEAD_SHA"

          wait "$SMOKE_PID"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Update preview link
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.pages.outputs.base_url }}/pr-${{ github.event.pull_request.number }}/
          HEAD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          MARKER='<!-- orbital-cleanup-preview -->'
          SHORT_SHA="${HEAD_SHA:0:8}"
          BODY="${MARKER}
          ## 🎮 Playable PR Preview

          **[Open Orbital Cleanup Co. PR #${PR_NUMBER}](${PREVIEW_URL})**

          Build: \`${SHORT_SHA}\`
          Provider: \`debug\`"

          COMMENT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1)"
          if [[ -n "$COMMENT_ID" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -f body="$BODY" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null
          fi

  merge:
    name: Merge
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout merged revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Restore Godot toolchain
        id: godot-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/occ-godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: occ-godot-web-v1-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot toolchain on cold cache
        if: steps.godot-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/.cache/occ-godot"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.cache/occ-godot/godot"
          chmod +x "$HOME/.cache/occ-godot/godot"

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz" -o /tmp/templates.tpz
          rm -rf /tmp/occ-templates
          mkdir -p /tmp/occ-templates
          unzip -q /tmp/templates.tpz 'templates/web*.zip' 'templates/version.txt' -d /tmp/occ-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/occ-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Activate Godot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$HOME/.cache/occ-godot/godot"
          sudo ln -sf "$HOME/.cache/occ-godot/godot" /usr/local/bin/godot

      - name: Restore imported resources
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: occ-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.gd', '**/*.tscn', '**/*.tres', 'content/**/*.json', 'schemas/**/*.json', 'assets/**/*', 'i18n/**/*') }}
          restore-keys: |
            occ-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Export production Web
        shell: bash
        env:
          OCC_PROVIDER: debug
          OCC_ENVIRONMENT: production
          OCC_COMMIT: ${{ github.sha }}
          OCC_WORKFLOW_RUN: ${{ github.run_id }}
          OCC_GAMEMONETIZE_GAME_ID: ""
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/occ-export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERR_FILE_CORRUPT|Error loading image:|Error importing ' /tmp/occ-export.log; then
            exit 1
          fi

          mkdir -p build/web/platform
          cp web/platform/*.js build/web/platform/
          cp assets/branding/orbital_cleanup_icon.svg build/web/favicon.svg
          VERSION="$(tr -d '\r\n' < VERSION)"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sed -i \
            -e "s|__OCC_PROVIDER__|${OCC_PROVIDER}|g" \
            -e "s|__OCC_VERSION__|${VERSION}|g" \
            -e "s|__OCC_COMMIT__|${OCC_COMMIT}|g" \
            -e "s|__OCC_ENVIRONMENT__|${OCC_ENVIRONMENT}|g" \
            -e "s|__OCC_WORKFLOW_RUN__|${OCC_WORKFLOW_RUN}|g" \
            -e "s|__OCC_BUILT_AT__|${BUILT_AT}|g" \
            -e "s|__OCC_GAMEMONETIZE_GAME_ID__|${OCC_GAMEMONETIZE_GAME_ID}|g" \
            build/web/platform/platform-config.js

          test -s build/web/index.html
          test -s build/web/index.wasm

      - name: Save production build
        uses: actions/upload-artifact@v4
        with:
          name: occ-web-production
          path: build/web
          if-no-files-found: error
          retention-days: 30

      - name: Compose production site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/compose-pages-site.sh site build/web push "" "$HEAD_SHA"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload production
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy production
        id: deployment
        uses: actions/deploy-pages@v4
