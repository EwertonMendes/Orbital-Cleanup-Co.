name: Orbital Cleanup Co. Web

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: occ-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  build-web:
    name: Validate and build Web
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      tested_sha: ${{ steps.source.outputs.sha }}
      head_sha: ${{ steps.source.outputs.head_sha }}
      default_branch: ${{ steps.source.outputs.default_branch }}
    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            SHA="$PR_HEAD_SHA"
          else
            SHA="$PUSH_SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "default_branch=${DEFAULT_BRANCH:-master}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Validate repository bootstrap
        shell: bash
        run: python3 tools/validate_bootstrap.py

      - name: Restore Godot Web toolchain cache
        id: godot-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/occ-godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: occ-godot-web-v1-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot Web toolchain on cache miss
        if: steps.godot-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/.cache/occ-godot"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.cache/occ-godot/godot"
          chmod +x "$HOME/.cache/occ-godot/godot"

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz" -o /tmp/templates.tpz
          rm -rf /tmp/occ-templates
          mkdir -p /tmp/occ-templates
          unzip -q /tmp/templates.tpz 'templates/web*.zip' 'templates/version.txt' -d /tmp/occ-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/occ-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Activate Godot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$HOME/.cache/occ-godot/godot"
          sudo ln -sf "$HOME/.cache/occ-godot/godot" /usr/local/bin/godot
          godot --version

      - name: Restore imported-resource cache
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: occ-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.gd', '**/*.tscn', '**/*.tres', 'assets/**/*', 'i18n/**/*') }}
          restore-keys: |
            occ-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Import and validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/occ-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERR_FILE_CORRUPT|Error loading image:|Error importing ' /tmp/occ-import.log; then
            exit 1
          fi

      - name: Export Web build
        shell: bash
        env:
          OCC_PROVIDER: debug
          OCC_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          OCC_COMMIT: ${{ steps.source.outputs.sha }}
          OCC_WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/occ-export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERR_FILE_CORRUPT|Error loading image:|Error importing ' /tmp/occ-export.log; then
            exit 1
          fi

          mkdir -p build/web/platform
          cp web/platform/*.js build/web/platform/
          cp assets/branding/orbital_cleanup_icon.svg build/web/favicon.svg
          VERSION="$(tr -d '\r\n' < VERSION)"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sed -i             -e "s|__OCC_PROVIDER__|${OCC_PROVIDER}|g"             -e "s|__OCC_VERSION__|${VERSION}|g"             -e "s|__OCC_COMMIT__|${OCC_COMMIT}|g"             -e "s|__OCC_ENVIRONMENT__|${OCC_ENVIRONMENT}|g"             -e "s|__OCC_WORKFLOW_RUN__|${OCC_WORKFLOW_RUN}|g"             -e "s|__OCC_BUILT_AT__|${BUILT_AT}|g"             build/web/platform/platform-config.js

          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          test -s build/web/index.pck
          test -s build/web/platform/platform-config.js
          test -s build/web/favicon.svg

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: occ-web-build
          path: build/web
          if-no-files-found: error
          retention-days: 30

  browser-smoke:
    name: Browser smoke
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-web.outputs.tested_sha }}

      - name: Download Web build
        uses: actions/download-artifact@v5
        with:
          name: occ-web-build
          path: build/web

      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: occ-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Prepare Playwright
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts "playwright@${PLAYWRIGHT_VERSION}"
          test -x /usr/bin/google-chrome

      - name: Run browser smoke
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory build/web >/tmp/occ-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node .github/scripts/browser-smoke.mjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occ-web-smoke-${{ github.run_id }}
          path: build/smoke-*.png
          if-no-files-found: warn
          retention-days: 14

  deploy-pages:
    name: Deploy Pages and PR preview
    needs:
      - build-web
      - browser-smoke
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: occ-pages-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-web.outputs.tested_sha }}

      - name: Download current Web build
        uses: actions/download-artifact@v5
        with:
          name: occ-web-build
          path: current

      - name: Compose production and open PR previews
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ needs.build-web.outputs.default_branch }}
          SOURCE_EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ needs.build-web.outputs.head_sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/compose-pages-site.sh site current "$SOURCE_EVENT" "$PR_NUMBER" "$HEAD_SHA"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Update playable preview comment
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.pages.outputs.base_url }}/pr-${{ github.event.pull_request.number }}/
          HEAD_SHA: ${{ needs.build-web.outputs.head_sha }}
        run: |
          set -euo pipefail
          MARKER='<!-- orbital-cleanup-preview -->'
          SHORT_SHA="${HEAD_SHA:0:8}"
          BODY="${MARKER}
          ## 🎮 Playable PR Preview

          **[Open Orbital Cleanup Co. PR #${PR_NUMBER}](${PREVIEW_URL})**

          Build: \`${SHORT_SHA}\`
          Provider: \`debug\`

          This URL points to the exact tested PR revision. Other open PR previews are preserved in the same Pages deployment."

          COMMENT_ID="$(gh api             "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"             --paginate             --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id"             | head -n 1)"

          if [[ -n "$COMMENT_ID" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -f body="$BODY" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null
          fi
