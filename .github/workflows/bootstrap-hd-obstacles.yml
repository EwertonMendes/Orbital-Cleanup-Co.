name: Bootstrap HD biome obstacles

on:
  push:
    branches:
      - content/biome-hd-obstacles

permissions:
  contents: write

jobs:
  install-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: content/biome-hd-obstacles
          fetch-depth: 0

      - name: Wait for HD obstacle bundle
        if: hashFiles('tools/occ_obstacles_runtime.zip') == ''
        run: echo "Obstacle bundle not staged yet."

      - name: Install HD biome obstacles
        if: hashFiles('tools/occ_obstacles_runtime.zip') != ''
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/occ-obstacles
          mkdir -p /tmp/occ-obstacles
          unzip -o tools/occ_obstacles_runtime.zip -d /tmp/occ-obstacles
          mkdir -p assets/original/obstacles/{earth_orbit,lunar_belt,mars_freight,blue_nebula}
          cp /tmp/occ-obstacles/earth_meteorite_*_hd.webp assets/original/obstacles/earth_orbit/
          cp /tmp/occ-obstacles/lunar_boulder_*_hd.webp assets/original/obstacles/lunar_belt/
          cp /tmp/occ-obstacles/mars_rock_*_hd.webp assets/original/obstacles/mars_freight/
          cp /tmp/occ-obstacles/nebula_fragment_*_hd.webp assets/original/obstacles/blue_nebula/

          python3 - <<'PY'
          from pathlib import Path
          import json

          biome_obstacles = {
              'earth_orbit': [
                  ('earth_meteorite_01', 24, 54, 0.92, 1.12),
                  ('earth_meteorite_02', 22, 47, 0.90, 1.12),
                  ('earth_meteorite_03', 20, 40, 0.90, 1.14),
                  ('earth_meteorite_04', 18, 33, 0.88, 1.16),
                  ('earth_meteorite_05', 16, 27, 0.88, 1.20),
              ],
              'lunar_belt': [
                  ('lunar_boulder_01', 24, 55, 0.94, 1.15),
                  ('lunar_boulder_02', 22, 48, 0.92, 1.14),
                  ('lunar_boulder_03', 20, 40, 0.90, 1.12),
                  ('lunar_boulder_04', 18, 34, 0.90, 1.14),
                  ('lunar_boulder_05', 16, 27, 0.88, 1.18),
              ],
              'mars_freight': [
                  ('mars_rock_01', 24, 55, 0.94, 1.16),
                  ('mars_rock_02', 22, 48, 0.92, 1.14),
                  ('mars_rock_03', 20, 40, 0.90, 1.14),
                  ('mars_rock_04', 18, 34, 0.90, 1.16),
                  ('mars_rock_05', 16, 27, 0.90, 1.20),
              ],
              'blue_nebula': [
                  ('nebula_fragment_01', 20, 52, 0.84, 1.06),
                  ('nebula_fragment_02', 21, 45, 0.82, 1.08),
                  ('nebula_fragment_03', 20, 38, 0.82, 1.08),
                  ('nebula_fragment_04', 19, 31, 0.80, 1.10),
                  ('nebula_fragment_05', 20, 24, 0.78, 1.12),
              ],
          }

          for biome_id, entries in biome_obstacles.items():
              path = Path(f'content/biomes/{biome_id}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              folder = biome_id
              data['obstacles'] = [
                  {
                      'id': obstacle_id,
                      'sprite': f'res://assets/original/obstacles/{folder}/{obstacle_id}_hd.webp',
                      'weight': weight,
                      'collision_radius': radius,
                      'scale_min': scale_min,
                      'scale_max': scale_max,
                      'texture_reference_size': 128,
                      'sprite_modulate': '#ffffffff',
                  }
                  for obstacle_id, weight, radius, scale_min, scale_max in entries
              ]
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          schema_path = Path('schemas/biome.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          props = schema['properties']['obstacles']['items']['properties']
          props['texture_reference_size'] = {'type': 'number', 'exclusiveMinimum': 0}
          props['sprite_modulate'] = {'type': 'string'}
          schema_path.write_text(json.dumps(schema, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          gd_path = Path('src/game/sector/sector_obstacle.gd')
          gd = gd_path.read_text(encoding='utf-8')
          old = '''\tsprite.texture = load(texture_path) as Texture2D
          \tassert(sprite.texture != null, "SectorObstacle texture must load: %s" % texture_path)
          \tsprite.scale = Vector2.ONE * _visual_scale
          \tsprite.modulate = Color(0.58, 0.62, 0.66, 0.96)
          '''
          new = '''\tsprite.texture = load(texture_path) as Texture2D
          \tassert(sprite.texture != null, "SectorObstacle texture must load: %s" % texture_path)
          \tvar texture_scale := 1.0
          \tvar reference_size := float(_definition.get("texture_reference_size", 0.0))
          \tif reference_size > 0.0:
          \t\tvar texture_size := maxf(float(sprite.texture.get_width()), float(sprite.texture.get_height()))
          \t\ttexture_scale = reference_size / maxf(texture_size, 1.0)
          \tsprite.scale = Vector2.ONE * _visual_scale * texture_scale
          \tvar tint_text := String(_definition.get("sprite_modulate", "#949ea8f5"))
          \tsprite.modulate = Color.from_string(tint_text, Color(0.58, 0.62, 0.66, 0.96))
          '''
          if old not in gd:
              raise RuntimeError('Expected SectorObstacle sprite setup block was not found.')
          gd_path.write_text(gd.replace(old, new), encoding='utf-8')

          readme_path = Path('assets/original/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          section = '''

          ## Biome obstacle artwork

          The launch biomes use project-owned HD obstacle packs under `obstacles/`. Each biome has five transparent raster variants so obstacle silhouettes and materials reinforce biome identity instead of reusing the same grey meteor artwork.

          - `earth_orbit/`: dark iron/nickel orbital meteorites;
          - `lunar_belt/`: pale cratered regolith boulders;
          - `mars_freight/`: rust-orange Martian rock with exposed dark basalt;
          - `blue_nebula/`: cold blue/violet mineral fragments.

          Obstacle collision remains authored in biome content. `texture_reference_size` normalizes HD raster resolution without changing gameplay footprint, while `sprite_modulate` allows full-color original artwork without changing legacy obstacle rendering in other biomes.
          '''
          if '## Biome obstacle artwork' not in readme:
              readme_path.write_text(readme.rstrip() + section + '\n', encoding='utf-8')
          PY

          rm -f tools/occ_obstacles_runtime.zip
          rm -f .github/workflows/bootstrap-hd-obstacles.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add biome-specific HD obstacle packs"
          git push origin HEAD:content/biome-hd-obstacles
