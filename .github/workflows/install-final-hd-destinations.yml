name: Install final HD destination artwork

on:
  push:
    branches:
      - content/hd-celestial-batch-01

permissions:
  contents: write

jobs:
  install-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: content/hd-celestial-batch-01
          fetch-depth: 0

      - name: Check staged bundles
        id: bundle
        shell: bash
        run: |
          if [[ -f tools/celestial_final_part1.zip && -f tools/celestial_final_part2.zip && -f tools/celestial_final_part3.zip && -f tools/celestial_final_part4.zip ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install final HD destination artwork
        if: steps.bundle.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/celestial-final
          mkdir -p /tmp/celestial-final
          for part in tools/celestial_final_part{1,2,3,4}.zip; do
            unzip -o "$part" -d /tmp/celestial-final
          done

          mkdir -p assets/original/destinations assets/original/landmarks

          for name in \
            crystal_world_hd.webp \
            ice_giant_exoplanet_hd.webp \
            kepler_186f_hd.webp \
            lava_world_hd.webp \
            ocean_world_hd.webp \
            ringed_exoplanet_hd.webp \
            rogue_planet_hd.webp \
            trappist_1_hd.webp \
            green_nebula_hd.webp \
            neutron_star_hd.webp \
            proxima_centauri_hd.webp \
            solar_corona_hd.webp \
            white_dwarf_hd.webp \
            abandoned_station_hd.webp \
            orbital_factory_ruins_hd.webp \
            ship_graveyard_hd.webp; do
            cp "/tmp/celestial-final/$name" "assets/original/destinations/$name"
          done
          cp /tmp/celestial-final/fractured_moonlet_hd.webp assets/original/landmarks/fractured_moonlet_hd.webp

          python3 - <<'PY'
          from pathlib import Path
          import json

          biome_assets = {
              'crystal_world': 'crystal_world_hd.webp',
              'ice_giant_exoplanet': 'ice_giant_exoplanet_hd.webp',
              'kepler_186f': 'kepler_186f_hd.webp',
              'lava_world': 'lava_world_hd.webp',
              'ocean_world': 'ocean_world_hd.webp',
              'ringed_exoplanet': 'ringed_exoplanet_hd.webp',
              'rogue_planet': 'rogue_planet_hd.webp',
              'trappist_1': 'trappist_1_hd.webp',
              'green_nebula': 'green_nebula_hd.webp',
              'neutron_star': 'neutron_star_hd.webp',
              'proxima_centauri': 'proxima_centauri_hd.webp',
              'solar_corona': 'solar_corona_hd.webp',
              'white_dwarf': 'white_dwarf_hd.webp',
              'abandoned_station': 'abandoned_station_hd.webp',
              'orbital_factory_ruins': 'orbital_factory_ruins_hd.webp',
              'ship_graveyard': 'ship_graveyard_hd.webp',
          }

          for biome_id, filename in biome_assets.items():
              path = Path(f'content/biomes/{biome_id}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              profile = data['visual_profile']
              profile['primary_asset'] = f'res://assets/original/destinations/{filename}'
              profile['primary_reference_size'] = 512
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          landmark_path = Path('content/landmarks/fractured_moonlet.json')
          landmark = json.loads(landmark_path.read_text(encoding='utf-8'))
          landmark['sprite'] = 'res://assets/original/landmarks/fractured_moonlet_hd.webp'
          landmark['texture_reference_size'] = 512
          landmark_path.write_text(json.dumps(landmark, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          schema_path = Path('schemas/landmark.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          schema['properties']['texture_reference_size'] = {
              'type': 'number',
              'exclusiveMinimum': 0
          }
          schema_path.write_text(json.dumps(schema, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          runtime_path = Path('src/game/sector/sector_landmark.gd')
          runtime = runtime_path.read_text(encoding='utf-8')
          old = '''\tvar visual_scale := float(_definition.get("scale", 1.0))
          \tsprite.scale = Vector2.ONE * visual_scale
          \tsprite.modulate = Color(1.0, 1.0, 1.0, 0.96)
          \t_configure_collision()
          \tvar texture_size := sprite.texture.get_size() * visual_scale
          '''
          new = '''\tvar visual_scale := float(_definition.get("scale", 1.0))
          \tvar texture_scale := 1.0
          \tvar reference_size := float(_definition.get("texture_reference_size", 0.0))
          \tif reference_size > 0.0:
          \t\tvar max_texture_size := maxf(float(sprite.texture.get_width()), float(sprite.texture.get_height()))
          \t\ttexture_scale = reference_size / maxf(max_texture_size, 1.0)
          \tsprite.scale = Vector2.ONE * visual_scale * texture_scale
          \tsprite.modulate = Color(1.0, 1.0, 1.0, 0.96)
          \t_configure_collision()
          \tvar texture_size := sprite.texture.get_size() * visual_scale * texture_scale
          '''
          if old not in runtime:
              raise RuntimeError('Expected SectorLandmark scaling block was not found.')
          runtime_path.write_text(runtime.replace(old, new), encoding='utf-8')

          # Final coverage audit: every authored biome primary visual must now be raster HD.
          remaining_svg = []
          missing_assets = []
          biome_paths = sorted(Path('content/biomes').glob('*.json'))
          for path in biome_paths:
              data = json.loads(path.read_text(encoding='utf-8'))
              asset = str(data.get('visual_profile', {}).get('primary_asset', ''))
              if asset.endswith('.svg'):
                  remaining_svg.append((path.stem, asset))
              if asset.startswith('res://'):
                  disk = Path(asset.removeprefix('res://'))
                  if not disk.exists():
                      missing_assets.append((path.stem, asset))
          if remaining_svg:
              raise RuntimeError(f'Legacy SVG biome primary assets remain: {remaining_svg}')
          if missing_assets:
              raise RuntimeError(f'Missing biome primary assets: {missing_assets}')
          if len(biome_paths) != 50:
              raise RuntimeError(f'Expected 50 authored biomes, found {len(biome_paths)}')

          landmark = json.loads(landmark_path.read_text(encoding='utf-8'))
          if landmark['sprite'].endswith('.svg'):
              raise RuntimeError('Fractured Moonlet still references SVG.')
          if not Path(landmark['sprite'].removeprefix('res://')).exists():
              raise RuntimeError('Fractured Moonlet HD asset is missing.')
          PY

          rm -f tools/celestial_final_part{1,2,3,4}.zip
          rm -f .github/workflows/install-final-hd-destinations.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finish HD destination artwork migration"
          git push origin HEAD:content/hd-celestial-batch-01
