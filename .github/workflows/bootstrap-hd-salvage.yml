name: Bootstrap HD salvage assets

on:
  push:
    branches:
      - feat/hd-salvage-assets

permissions:
  contents: write

jobs:
  install-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/hd-salvage-assets
          fetch-depth: 0

      - name: Stop until bundle exists
        if: hashFiles('tools/salvage_assets_bundle.zip') == ''
        run: echo "Bundle not uploaded yet."

      - name: Install HD salvage assets and update content
        if: hashFiles('tools/salvage_assets_bundle.zip') != ''
        shell: bash
        run: |
          set -euo pipefail
          cp tools/salvage_assets_bundle.zip /tmp/salvage-assets.zip
          mkdir -p assets/original/salvage
          unzip -o /tmp/salvage-assets.zip -d assets/original/salvage

          python3 - <<'PY'
          from pathlib import Path
          import json

          salvage_dir = Path('content/salvage')
          for path in sorted(salvage_dir.glob('*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              salvage_id = data['id']
              data['sprite'] = f'res://assets/original/salvage/{salvage_id}_hd.webp'
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          gd = Path('src/game/salvage/salvage_object.gd')
          text = gd.read_text(encoding='utf-8')
          anchor = 'const ENERGY_SHADER := preload("res://src/game/visual/salvage_energy.gdshader")\n'
          if 'SALVAGE_REFERENCE_TEXTURE_SIZE' not in text:
              text = text.replace(anchor, anchor + 'const SALVAGE_REFERENCE_TEXTURE_SIZE := 128.0\n')
          old = '\t_base_scale = Vector2.ONE * definition.visual_scale\n'
          new = (
              '\tvar texture_size := maxf(float(definition.sprite.get_width()), float(definition.sprite.get_height()))\n'
              '\tvar hd_scale := SALVAGE_REFERENCE_TEXTURE_SIZE / maxf(texture_size, 1.0)\n'
              '\t_base_scale = Vector2.ONE * definition.visual_scale * hd_scale\n'
          )
          if old in text:
              text = text.replace(old, ''.join(new))
          gd.write_text(text, encoding='utf-8')
          PY

          rm -f tools/salvage_assets_bundle.zip
          rm -f .github/workflows/bootstrap-hd-salvage.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate HD salvage artwork"
          git push origin HEAD:feat/hd-salvage-assets
